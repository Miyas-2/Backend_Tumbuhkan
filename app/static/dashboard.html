<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tumbuhkan Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
        }
        .card {
            background-color: var(--card-bg);
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .metric-card {
            transition: transform 0.2s;
        }
        .metric-card:hover {
            transform: translateY(-5px);
        }
        .metric-value {
            font-size: 2.5rem;
            font-weight: 600;
        }
        .metric-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
        .btn-period {
            background-color: transparent;
            border: 1px solid var(--text-secondary);
            color: var(--text-secondary);
        }
        .btn-period.active {
            background-color: var(--accent-blue);
            border-color: var(--accent-blue);
            color: white;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-transparent py-4">
        <div class="container">
            <span class="navbar-brand h1 fs-2 fw-bold">🌱 Tumbuhkan <span class="text-success">Monitor</span></span>
            <div class="d-flex align-items-center">
                <span class="badge bg-success me-2" id="status-badge">Connected</span>
                <span class="text-muted small" id="last-updated">Updating...</span>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <!-- Realtime Metrics -->
        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="card metric-card p-4">
                    <div class="metric-label">pH Level</div>
                    <div class="metric-value text-success" id="val-ph">--</div>
                    <small>Target: 6.0</small>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card metric-card p-4">
                    <div class="metric-label">TDS (PPM)</div>
                    <div class="metric-value text-primary" id="val-tds">--</div>
                    <small>Target: 800</small>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card metric-card p-4">
                    <div class="metric-label">Water Temp</div>
                    <div class="metric-value text-warning" id="val-temp-water">--°C</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card metric-card p-4">
                    <div class="metric-label">Air Temp</div>
                    <div class="metric-value text-warning" id="val-temp-air">--°C</div>
                </div>
            </div>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-md-3">
                <div class="card metric-card p-4">
                    <div class="metric-label">Humidity</div>
                    <div class="metric-value text-info" id="val-hum">--%</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card metric-card p-4">
                    <div class="metric-label">Water Level</div>
                    <div class="metric-value text-white" id="val-dist">-- cm</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card metric-card p-4">
                    <div class="metric-label">Water Flow</div>
                    <div class="metric-value text-white" id="val-flow">-- L/m</div>
                </div>
            </div>
             <div class="col-md-3">
                <div class="card metric-card p-4">
                    <div class="metric-label">LDR (Light)</div>
                    <div class="metric-value text-white" id="val-ldr">--</div>
                </div>
            </div>
        </div>

        <!-- Charts Section -->
        <div class="row mb-4">
            <div class="col-12 d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0">Historical Data</h4>
                <div class="btn-group" role="group">
                    <button type="button" class="btn btn-period active" onclick="loadCharts('day')">Daily</button>
                    <button type="button" class="btn btn-period" onclick="loadCharts('week')">Weekly</button>
                    <button type="button" class="btn btn-period" onclick="loadCharts('month')">Monthly</button>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="card p-4">
                    <h5 class="card-title mb-4">pH & TDS Trends</h5>
                    <div class="chart-container">
                        <canvas id="chart-water"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card p-4">
                    <h5 class="card-title mb-4">Air Conditions</h5>
                    <div class="chart-container">
                        <canvas id="chart-env"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-12">
                <div class="card p-4">
                    <h5 class="card-title mb-4">Water System (Level & Flow)</h5>
                    <div class="chart-container">
                        <canvas id="chart-system"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let waterChart, envChart, systemChart;
        let currentPeriod = 'day';

        // Initialize Charts
        function initCharts() {
            const commonOptions = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { labels: { color: '#94a3b8' } }
                },
                scales: {
                    y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                    x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
                }
            };

            // Water Chart (pH & TDS)
            const ctxWater = document.getElementById('chart-water').getContext('2d');
            waterChart = new Chart(ctxWater, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: 'pH',
                            data: [],
                            borderColor: '#10b981',
                            yAxisID: 'y',
                            tension: 0.4
                        },
                        {
                            label: 'TDS (ppm)',
                            data: [],
                            borderColor: '#3b82f6',
                            yAxisID: 'y1',
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    ...commonOptions,
                    scales: {
                        ...commonOptions.scales,
                        y: { ...commonOptions.scales.y, position: 'left', title: {display: true, text: 'pH'} },
                        y1: { ...commonOptions.scales.y, position: 'right', grid: {drawOnChartArea: false}, title: {display: true, text: 'TDS'} }
                    }
                }
            });

            // Env Chart (Temp & Hum)
            const ctxEnv = document.getElementById('chart-env').getContext('2d');
            envChart = new Chart(ctxEnv, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: 'Air Temp (°C)',
                            data: [],
                            borderColor: '#f59e0b',
                            tension: 0.4
                        },
                        {
                            label: 'Humidity (%)',
                            data: [],
                            borderColor: '#06b6d4',
                            tension: 0.4
                        }
                    ]
                },
                options: commonOptions
            });

            // System Chart (Distance & Flow)
            const ctxSystem = document.getElementById('chart-system').getContext('2d');
            systemChart = new Chart(ctxSystem, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: 'Water Level (cm)',
                            data: [],
                            borderColor: '#8b5cf6',
                            yAxisID: 'y',
                            tension: 0.4
                        },
                        {
                            label: 'Flow (L/m)',
                            data: [],
                            borderColor: '#ef4444',
                            yAxisID: 'y1',
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    ...commonOptions,
                    scales: {
                        ...commonOptions.scales,
                        y: { ...commonOptions.scales.y, position: 'left', title: {display: true, text: 'Level (cm)'} },
                        y1: { ...commonOptions.scales.y, position: 'right', grid: {drawOnChartArea: false}, title: {display: true, text: 'Flow (L/m)'} }
                    }
                }
            });
        }

        // Fetch Live Data
        async function fetchLive() {
            try {
                const res = await fetch('/api/v1/sensors/live');
                const json = await res.json();
                
                if (json.status === 'success' && json.data) {
                    const d = json.data;
                    document.getElementById('val-ph').innerText = d.ph ? d.ph.toFixed(1) : '--';
                    document.getElementById('val-tds').innerText = d.tds ? Math.round(d.tds) : '--';
                    document.getElementById('val-temp-water').innerText = d.temp_air ? d.temp_air.toFixed(1) + '°C' : '--';
                    document.getElementById('val-temp-air').innerText = d.temp_udara ? d.temp_udara.toFixed(1) + '°C' : '--';
                    document.getElementById('val-hum').innerText = d.humidity ? d.humidity.toFixed(0) + '%' : '--';
                    document.getElementById('val-dist').innerText = d.distance ? d.distance.toFixed(1) + ' cm' : '--';
                    document.getElementById('val-flow').innerText = d.flow ? d.flow.toFixed(1) + ' L/m' : '--';
                    document.getElementById('val-ldr').innerText = d.ldr ? d.ldr : '--';
                    
                    document.getElementById('last-updated').innerText = 'Last updated: ' + new Date().toLocaleTimeString();
                    document.getElementById('status-badge').className = 'badge bg-success me-2';
                    document.getElementById('status-badge').innerText = 'Connected';
                } else {
                    document.getElementById('status-badge').className = 'badge bg-secondary me-2';
                    document.getElementById('status-badge').innerText = 'No Data';
                }
            } catch (e) {
                console.error(e);
                document.getElementById('status-badge').className = 'badge bg-danger me-2';
                document.getElementById('status-badge').innerText = 'Offline';
            }
        }

        // Fetch Historical Data
        async function loadCharts(period) {
            currentPeriod = period;
            
            // Update buttons
            document.querySelectorAll('.btn-period').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            try {
                const res = await fetch(`/api/v1/sensors/summary?period=${period}`);
                const data = await res.json();

                // Process data
                const labels = data.map(d => {
                    const date = new Date(d.timestamp);
                    if (period === 'day') return date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    return date.toLocaleDateString([], {day: 'numeric', month: 'short'});
                });

                // Update Water Chart
                waterChart.data.labels = labels;
                waterChart.data.datasets[0].data = data.map(d => d.ph);
                waterChart.data.datasets[1].data = data.map(d => d.tds);
                waterChart.update();

                // Update Env Chart
                envChart.data.labels = labels;
                envChart.data.datasets[0].data = data.map(d => d.temp_udara); // Air temp
                envChart.data.datasets[1].data = data.map(d => d.humidity);
                envChart.update();

                // Update System Chart
                systemChart.data.labels = labels;
                systemChart.data.datasets[0].data = data.map(d => d.distance);
                systemChart.data.datasets[1].data = data.map(d => d.flow);
                systemChart.update();

            } catch (e) {
                console.error("Error loading charts:", e);
            }
        }

        // Start
        initCharts();
        loadCharts('day'); // Initial load
        fetchLive();
        
        // Polling
        setInterval(fetchLive, 3000); // Realtime every 3s
        setInterval(() => loadCharts(currentPeriod), 60000); // Charts every 1m
    </script>
</body>
</html>
