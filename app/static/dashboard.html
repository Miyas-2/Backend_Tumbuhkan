<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tumbuhkan Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }
        body {
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 12px;
        }
        .metric-card {
            text-align: center;
        }
        .metric-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            text-transform: uppercase;
        }
        .metric-value {
            font-size: 2.5rem;
            font-weight: 700;
        }
        .chart-container {
            position: relative;
            height: 280px;
        }
        .btn-period {
            background: #334155;
            border: none;
            color: #94a3b8;
        }
        .btn-period.active, .btn-period:hover {
            background: #3b82f6;
            color: white;
        }
        .text-success { color: #10b981 !important; }
        .text-primary { color: #3b82f6 !important; }
        .text-warning { color: #f59e0b !important; }
        .text-info { color: #06b6d4 !important; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark py-3 mb-4">
        <div class="container">
            <span class="navbar-brand">🌱 Tumbuhkan Monitor</span>
            <span>
                <span class="badge bg-secondary me-2" id="status-badge">Connecting...</span>
                <small class="text-secondary" id="last-updated">--</small>
            </span>
        </div>
    </nav>

    <div class="container pb-5">
        <!-- Realtime Metrics Row 1 -->
        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="card metric-card p-4">
                    <div class="metric-label">pH Level</div>
                    <div class="metric-value text-success" id="val-ph">--</div>
                    <small>Target: 6.0</small>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card metric-card p-4">
                    <div class="metric-label">TDS (PPM)</div>
                    <div class="metric-value text-primary" id="val-tds">--</div>
                    <small>Target: 800</small>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card metric-card p-4">
                    <div class="metric-label">Water Temp</div>
                    <div class="metric-value text-warning" id="val-temp-water">--</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card metric-card p-4">
                    <div class="metric-label">Air Temp</div>
                    <div class="metric-value text-warning" id="val-temp-air">--</div>
                </div>
            </div>
        </div>

        <!-- Realtime Metrics Row 2 -->
        <div class="row g-4 mb-5">
            <div class="col-md-3">
                <div class="card metric-card p-4">
                    <div class="metric-label">Humidity</div>
                    <div class="metric-value text-info" id="val-hum">--</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card metric-card p-4">
                    <div class="metric-label">Water Level</div>
                    <div class="metric-value text-white" id="val-dist">--</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card metric-card p-4">
                    <div class="metric-label">Water Flow</div>
                    <div class="metric-value text-white" id="val-flow">--</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card metric-card p-4">
                    <div class="metric-label">LDR (Light)</div>
                    <div class="metric-value text-white" id="val-ldr">--</div>
                </div>
            </div>
        </div>

        <!-- Charts Section -->
        <div class="row mb-4">
            <div class="col-12 d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0">Historical Data</h4>
                <div class="btn-group" role="group">
                    <button type="button" class="btn btn-period active" onclick="loadCharts('day')">Daily</button>
                    <button type="button" class="btn btn-period" onclick="loadCharts('week')">Weekly</button>
                    <button type="button" class="btn btn-period" onclick="loadCharts('month')">Monthly</button>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="card p-4">
                    <h5 class="card-title mb-4">pH & TDS Trends</h5>
                    <div class="chart-container">
                        <canvas id="chart-water"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card p-4">
                    <h5 class="card-title mb-4">Air Conditions</h5>
                    <div class="chart-container">
                        <canvas id="chart-env"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-12">
                <div class="card p-4">
                    <h5 class="card-title mb-4">Water System (Level & Flow)</h5>
                    <div class="chart-container">
                        <canvas id="chart-system"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let waterChart, envChart, systemChart;
        let currentPeriod = 'day';

        // Initialize Charts
        function initCharts() {
            const commonOptions = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { labels: { color: '#94a3b8' } }
                },
                scales: {
                    y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                    x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
                }
            };

            // Water Chart (pH & TDS)
            const ctxWater = document.getElementById('chart-water').getContext('2d');
            waterChart = new Chart(ctxWater, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        { label: 'pH', data: [], borderColor: '#10b981', yAxisID: 'y', tension: 0.4 },
                        { label: 'TDS (ppm)', data: [], borderColor: '#3b82f6', yAxisID: 'y1', tension: 0.4 }
                    ]
                },
                options: {
                    ...commonOptions,
                    scales: {
                        ...commonOptions.scales,
                        y: { ...commonOptions.scales.y, position: 'left', title: {display: true, text: 'pH', color: '#94a3b8'} },
                        y1: { ...commonOptions.scales.y, position: 'right', grid: {drawOnChartArea: false}, title: {display: true, text: 'TDS', color: '#94a3b8'} }
                    }
                }
            });

            // Env Chart (Temp & Hum)
            const ctxEnv = document.getElementById('chart-env').getContext('2d');
            envChart = new Chart(ctxEnv, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        { label: 'Air Temp (C)', data: [], borderColor: '#f59e0b', tension: 0.4 },
                        { label: 'Humidity (%)', data: [], borderColor: '#06b6d4', tension: 0.4 }
                    ]
                },
                options: commonOptions
            });

            // System Chart (Distance & Flow)
            const ctxSystem = document.getElementById('chart-system').getContext('2d');
            systemChart = new Chart(ctxSystem, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        { label: 'Water Level (cm)', data: [], borderColor: '#8b5cf6', yAxisID: 'y', tension: 0.4 },
                        { label: 'Flow (L/m)', data: [], borderColor: '#ef4444', yAxisID: 'y1', tension: 0.4 }
                    ]
                },
                options: {
                    ...commonOptions,
                    scales: {
                        ...commonOptions.scales,
                        y: { ...commonOptions.scales.y, position: 'left', title: {display: true, text: 'Level (cm)', color: '#94a3b8'} },
                        y1: { ...commonOptions.scales.y, position: 'right', grid: {drawOnChartArea: false}, title: {display: true, text: 'Flow (L/m)', color: '#94a3b8'} }
                    }
                }
            });
        }

        // Fetch Live Data
        async function fetchLive() {
            try {
                const res = await fetch('/api/v1/sensors/live');
                const json = await res.json();
                
                if (json.status === 'success' && json.data) {
                    const d = json.data;
                    document.getElementById('val-ph').innerText = d.ph != null ? d.ph.toFixed(1) : '--';
                    document.getElementById('val-tds').innerText = d.tds != null ? Math.round(d.tds) : '--';
                    document.getElementById('val-temp-water').innerText = d.temp_air != null ? d.temp_air.toFixed(1) + 'C' : '--';
                    document.getElementById('val-temp-air').innerText = d.temp_udara != null ? d.temp_udara.toFixed(1) + 'C' : '--';
                    document.getElementById('val-hum').innerText = d.humidity != null ? d.humidity.toFixed(0) + '%' : '--';
                    document.getElementById('val-dist').innerText = d.distance != null ? d.distance.toFixed(1) + ' cm' : '--';
                    document.getElementById('val-flow').innerText = d.flow != null ? d.flow.toFixed(1) + ' L/m' : '--';
                    document.getElementById('val-ldr').innerText = d.ldr != null ? d.ldr : '--';
                    
                    document.getElementById('last-updated').innerText = 'Updated: ' + new Date().toLocaleTimeString();
                    document.getElementById('status-badge').className = 'badge bg-success me-2';
                    document.getElementById('status-badge').innerText = 'Connected';
                } else {
                    document.getElementById('status-badge').className = 'badge bg-secondary me-2';
                    document.getElementById('status-badge').innerText = 'No Data';
                }
            } catch (e) {
                console.error(e);
                document.getElementById('status-badge').className = 'badge bg-danger me-2';
                document.getElementById('status-badge').innerText = 'Offline';
            }
        }

        // Fetch Historical Data
        async function loadCharts(period) {
            currentPeriod = period;
            
            // Update buttons
            document.querySelectorAll('.btn-period').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            try {
                const res = await fetch(`/api/v1/sensors/summary?period=${period}`);
                const data = await res.json();

                if (!data || data.length === 0) {
                    console.log('No data for period:', period);
                    return;
                }

                // Process data
                const labels = data.map(d => {
                    const date = new Date(d.timestamp);
                    if (period === 'day') return date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    return date.toLocaleDateString([], {day: 'numeric', month: 'short'});
                });

                // Update Water Chart
                waterChart.data.labels = labels;
                waterChart.data.datasets[0].data = data.map(d => d.ph);
                waterChart.data.datasets[1].data = data.map(d => d.tds);
                waterChart.update();

                // Update Env Chart
                envChart.data.labels = labels;
                envChart.data.datasets[0].data = data.map(d => d.temp_udara);
                envChart.data.datasets[1].data = data.map(d => d.humidity);
                envChart.update();

                // Update System Chart
                systemChart.data.labels = labels;
                systemChart.data.datasets[0].data = data.map(d => d.distance);
                systemChart.data.datasets[1].data = data.map(d => d.flow);
                systemChart.update();

            } catch (e) {
                console.error("Error loading charts:", e);
            }
        }

        // Start
        initCharts();
        loadCharts('day');
        fetchLive();
        
        // Polling
        setInterval(fetchLive, 3000);
        setInterval(() => loadCharts(currentPeriod), 60000);
    </script>
</body>
</html>
